[package]
name = "opendj-studio"
description = "openDJ Studio: a clip-launching DAW on openDJ's engine (test app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "opendj-studio"
path = "src/main.rs"

[dependencies]
# The Groove Box kits and samples. Without Whisper, which the studio
# doesn't need. openDJ never depends on this crate, so it can move to its
# own repository.
opendj-engine = { path = "../engine", default-features = false }
cpal = "0.18"
rtrb = "0.4"
rusty_link = "0.4"
slint = "~1.18"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["realtime"] }

[build-dependencies]
slint-build = "~1.18"
